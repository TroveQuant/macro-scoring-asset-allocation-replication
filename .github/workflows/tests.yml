name: Tests

# Offline checks only: no market-data download, no secrets, no commits.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Validate configuration without downloading data
        run: python run_replication.py --config config/base.yml --validate-config

      # Every test uses fixtures committed under tests/ and never calls the
      # Yahoo endpoint, so the whole suite is the offline subset; nothing is
      # excluded. The real-data backtest stays in paper-replication.yml
      # (manual workflow_dispatch only).
      - name: Run offline tests
        run: python -m pytest -q

      - name: Scan explicit upload candidates
        run: python tools/check_upload_candidates.py
